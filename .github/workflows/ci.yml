name: CI

# Verifica de punta a punta la definición del despliegue: valida el compose,
# construye las cuatro imágenes desde los repositorios del equipo, levanta el
# stack completo (Postgres incluido) y corre la prueba de humo a través del
# front (que proxya /api/ al gateway, como en producción).
# El despliegue en el homelab se ejecuta con scripts/deploy.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: Construir y probar el stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Revisar scripts de shell
        run: shellcheck scripts/*.sh docker/postgres/*.sh

      - name: Preparar entorno de prueba
        run: |
          docker network create coolify
          {
            echo "POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "AUTH_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "PRESCRIPTIONS_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
          } > .env

      - name: Validar el compose
        run: docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml config -q

      - name: Construir y levantar
        run: docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml up -d --build

      - name: Esperar al front y al gateway
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/cie10 || true)
            [ "$code" = "401" ] && exit 0
            sleep 3
          done
          echo "La app no respondió 401 a través del front a tiempo (último código: $code)"; exit 1

      - name: Prueba de humo
        run: scripts/smoke-test.sh http://localhost:8080

      - name: Registros de los contenedores
        if: failure()
        run: docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml logs --no-color --tail 80

      - name: Apagar
        if: always()
        run: docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml down -v
